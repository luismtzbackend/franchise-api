version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: franchise-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - franchise-network

  redis:
    image: redis:7-alpine
    container_name: franchise-redis
    ports:
      - "6379:6379"
    networks:
      - franchise-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchise-api
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    networks:
      - franchise-network

volumes:
  mongodb_data:

networks:
  franchise-network:
    driver: bridge
